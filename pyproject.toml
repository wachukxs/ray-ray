[project]
name = "fleet-copilot"
version = "0.1.0"
description = "Agentic AI Fleet Copilot over device telemetry (LangGraph + Claude, with a deterministic offline brain)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "anthropic>=2.13",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Provider-agnostic brain (--mode langchain). Install only the provider packages you use.
langchain = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-anthropic>=1.0",
]

# Durable checkpoints: pending approvals survive a restart (FLEET_CHECKPOINT_DB=state/checkpoints.sqlite).
durable = ["langgraph-checkpoint-sqlite>=3"]

[project.scripts]
fleet-copilot = "fleet_copilot.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleet_copilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
